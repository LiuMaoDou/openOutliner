name: Verify remaining audit repairs
on:
  push:
    branches: [fix/reliability-hardening-20261112]
    paths:
      - .github/workflows/apply-remaining.yml
      - .maintenance/remaining-*
permissions:
  contents: write
concurrency:
  group: remaining-audit-repairs
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact reviewed source patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          manifest = json.loads((root / '.maintenance/remaining-manifest.json').read_text())
          paths = []
          for item in manifest['paths']:
              name = item['path']
              path = (root / name).resolve()
              if not path.is_relative_to(root) or name.startswith(('.git/', '.github/', 'data/', 'person/')):
                  raise ValueError('Invalid source path: ' + name)
              if item['before'] is None:
                  if path.exists(): raise ValueError('New target already exists: ' + name)
              else:
                  data = path.read_bytes()
                  actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  if actual != item['before']: raise ValueError('Source changed: ' + name)
              paths.append(name)
          encoded = ''.join((root / f'.maintenance/remaining-{i}.b64').read_text().strip() for i in range(1,5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != manifest['patch_sha256']: raise ValueError('Patch checksum mismatch')
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          for item in manifest['paths']:
              if hashlib.sha256((root / item['path']).read_bytes()).hexdigest() != item['after']:
                  raise ValueError('Output differs: ' + item['path'])
          subprocess.run(['python3', '.maintenance/remaining-followup.py'], check=True)
          pathlib.Path('/tmp/remaining-source-paths.json').write_text(json.dumps(paths))
          print('Applied and verified', len(paths), 'source/test paths. No production data accessed.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:reliability
      - run: npm run build
      - name: Install isolated browser tools
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/pip" install playwright==1.57.0
          "$RUNNER_TEMP/browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Preserve accepted editor interactions
        env:
          OO_BROWSER_ARTIFACTS: ${{ runner.temp }}/openoutliner-browser-results
        run: '"$RUNNER_TEMP/browser-venv/bin/python" tests/browser_smoke.py'
      - name: Verify remaining bugs in the real production build
        env:
          OO_BROWSER_ARTIFACTS: ${{ runner.temp }}/openoutliner-browser-results
        run: '"$RUNNER_TEMP/browser-venv/bin/python" tests/browser_remaining.py'
      - name: Commit verified fixes only to the repair branch
        run: |
          python3 - <<'PY'
          import json, subprocess
          paths = json.load(open('/tmp/remaining-source-paths.json'))
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'fix: complete async rollback, source mapping, clipboard, recovery and update safety'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/fix/reliability-hardening-20261112'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-repairs-browser-evidence
          path: ${{ runner.temp }}/openoutliner-browser-results
          if-no-files-found: ignore
          retention-days: 7
