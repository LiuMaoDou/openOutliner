name: Quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # Playwright 1.57 does not support the ubuntu-latest 26.04 image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Record dependency advisories separately from functional test results
        run: |
          mkdir -p "$RUNNER_TEMP/openoutliner-browser-results"
          set +e
          npm audit --json > "$RUNNER_TEMP/openoutliner-browser-results/npm-audit.json"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::npm audit reported advisories or could not complete; review npm-audit.json. Functional test success is not a security clearance."
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:reliability
      - run: npm run build
      - name: Install isolated browser-test tools
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/pip" install playwright==1.57.0
          "$RUNNER_TEMP/browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Preserve accepted editing and selection behavior
        env:
          OO_BROWSER_ARTIFACTS: ${{ runner.temp }}/openoutliner-browser-results
        run: '"$RUNNER_TEMP/browser-venv/bin/python" tests/browser_smoke.py'
      - name: Check rollback, source mapping, clipboard, recovery and updates in the real app
        env:
          OO_BROWSER_ARTIFACTS: ${{ runner.temp }}/openoutliner-browser-results
        run: '"$RUNNER_TEMP/browser-venv/bin/python" tests/browser_remaining.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: ${{ runner.temp }}/openoutliner-browser-results
          if-no-files-found: ignore
          retention-days: 7
  android-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and build tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Compile and verify isolated debug APK (no release)
        env:
          ANDROID_PLATFORM: android-36
          OPENOUTLINER_SIGNING_DIR: ${{ runner.temp }}/openoutliner-android-signing
        run: bash android/build.sh debug
