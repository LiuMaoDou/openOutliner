name: Quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Record dependency advisories separately from functional test results
        run: |
          mkdir -p "$RUNNER_TEMP/openoutliner-browser-results"
          set +e
          npm audit --json > "$RUNNER_TEMP/openoutliner-browser-results/npm-audit.json"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::npm audit reported advisories or could not complete; review npm-audit.json. Functional test success is not a security clearance."
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:reliability
      - run: npm run build
      - name: Install isolated browser-test tools
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/pip" install playwright==1.57.0
          "$RUNNER_TEMP/browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Preserve accepted editing and selection behavior
        env:
          OO_BROWSER_ARTIFACTS: ${{ runner.temp }}/openoutliner-browser-results
        run: '"$RUNNER_TEMP/browser-venv/bin/python" tests/browser_smoke.py'
      - name: Check rollback, source mapping, clipboard, recovery and updates in the real app
        env:
          OO_BROWSER_ARTIFACTS: ${{ runner.temp }}/openoutliner-browser-results
        run: '"$RUNNER_TEMP/browser-venv/bin/python" tests/browser_remaining.py'
      - name: Verify ruled outline geometry in light, dark and narrow layouts
        env:
          OO_BROWSER_ARTIFACTS: ${{ runner.temp }}/openoutliner-browser-results
        run: '"$RUNNER_TEMP/browser-venv/bin/python" tests/browser_grid.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: ${{ runner.temp }}/openoutliner-browser-results
          if-no-files-found: ignore
          retention-days: 7
