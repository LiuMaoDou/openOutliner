name: Quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:reliability
      - run: npm run build
      - name: Install isolated browser-test tools
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/pip" install playwright==1.57.0
          "$RUNNER_TEMP/browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Run the real app against a disposable database
        env:
          OO_BROWSER_ARTIFACTS: ${{ runner.temp }}/openoutliner-browser-results
        run: '"$RUNNER_TEMP/browser-venv/bin/python" tests/browser_smoke.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: ${{ runner.temp }}/openoutliner-browser-results
          if-no-files-found: ignore
          retention-days: 7
