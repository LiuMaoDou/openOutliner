name: Quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/reliability-hardening-20261112]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Record verification environment
        run: |
          node --version
          npm --version
          git rev-parse HEAD
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package review sources (temporary audit evidence)
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('.')
          roots = ['src', 'tests', 'build', 'deploy']
          paths = [p for name in roots for p in (root / name).rglob('*') if p.is_file() and p.suffix in {'.ts', '.tsx', '.css', '.json', '.md', '.mjs', '.py', '.png'}]
          paths += [root / name for name in ['package.json', 'package-lock.json', 'tsconfig.node.json', 'tsconfig.web.json', 'vite.config.ts', 'index.html', 'Dockerfile', 'README.md', 'AGENTS.md', '.gitignore', '.dockerignore', 'compose.yaml', 'public/manifest.webmanifest']]
          with zipfile.ZipFile('/tmp/openoutliner-review-source.zip', 'w', zipfile.ZIP_DEFLATED) as output:
              for path in paths:
                  if path.is_file(): output.write(path, path.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-source
          path: /tmp/openoutliner-review-source.zip
          retention-days: 1
