name: Apply and verify reviewed reliability patch
on:
  push:
    branches: [fix/reliability-hardening-20261112]
    paths: ['.maintenance/reliability.patch.json']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply baseline-locked changes
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path.cwd()
          manifest = json.loads(pathlib.Path('.maintenance/reliability.patch.json').read_text())
          plan = []
          def target(name):
              path = (root / name).resolve()
              if not path.is_relative_to(root) or name.startswith(('.git/', '.github/', 'data/', 'person/')):
                  raise ValueError('Invalid target: ' + name)
              return path
          for item in manifest['edits']:
              path = target(item['path'])
              old = path.read_bytes()
              blob = hashlib.sha1(b'blob ' + str(len(old)).encode() + b'\0' + old).hexdigest()
              if blob != item['expected_blob']:
                  raise ValueError('Source changed: ' + item['path'])
              content = old.decode()
              for edit in item['replacements']:
                  if content.count(edit['old']) != 1: raise ValueError('Ambiguous patch: ' + item['path'])
                  content = content.replace(edit['old'], edit['new'], 1)
              plan.append((path, content))
          for item in manifest['new_files']:
              path = target(item['path'])
              if path.exists(): raise ValueError('Target already exists: ' + item['path'])
              plan.append((path, item['content']))
          for path, content in plan:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)
          pathlib.Path('/tmp/reliability-paths.json').write_text(json.dumps([str(p.relative_to(root)) for p, _ in plan]))
          print('Applied', len(plan), 'reviewed paths; no production data accessed.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:reliability
      - run: npm run build
      - name: Install browser test tools
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/pip" install playwright==1.57.0
          "$RUNNER_TEMP/browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Verify actual React app using disposable data
        env:
          OO_BROWSER_ARTIFACTS: ${{ runner.temp }}/openoutliner-browser-results
        run: '"$RUNNER_TEMP/browser-venv/bin/python" tests/browser_smoke.py'
      - name: Commit verified source changes to the repair branch only
        run: |
          python3 - <<'PY'
          import json, subprocess
          paths = json.load(open('/tmp/reliability-paths.json'))
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'fix: harden database upgrades and atomic workspace updates'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/fix/reliability-hardening-20261112'], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-browser-results
          path: ${{ runner.temp }}/openoutliner-browser-results
          retention-days: 7
          if-no-files-found: ignore
