name: Prepare isolated review runtime
on:
  push:
    branches: [fix/reliability-hardening-20261112]
    paths: [.github/workflows/review-runtime.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Package dependencies only, without data or fonts
        run: tar --exclude='*.otf' --exclude='*.ttf' --exclude='*.woff' --exclude='*.woff2' -czf "$RUNNER_TEMP/review-dependencies.tgz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-review-dependencies
          path: ${{ runner.temp }}/review-dependencies.tgz
          retention-days: 1
